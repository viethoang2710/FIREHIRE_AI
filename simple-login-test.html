<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Login Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; margin: 5px; }
        input { margin: 10px; padding: 10px; width: 300px; display: block; }
        #log { background: #f5f5f5; padding: 10px; height: 400px; overflow-y: auto; font-family: monospace; }
        .error { color: red; }
        .success { color: green; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>Simple Login Test</h1>
    
    <div class="section">
        <h3>Login với tài khoản có sẵn</h3>
        <input type="email" id="email" placeholder="Email" value="nguyennhuphuc@example.com">
        <input type="password" id="password" placeholder="Password" value="password123">
        <button onclick="testLogin()">Test Login</button>
        <button onclick="checkUsers()">Check Users</button>
        <button onclick="testWithUser19()">Test với User ID 19</button>
    </div>

    <div class="section">
        <h3>Debug Log</h3>
        <div id="log"></div>
        <button onclick="clearLog()">Clear</button>
    </div>

    <script>
        function log(msg, type = 'info') {
            const logDiv = document.getElementById('log');
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            logDiv.innerHTML += `<span class="${className}">[${new Date().toLocaleTimeString()}] ${msg}</span>\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        async function checkUsers() {
            log('=== CHECKING USERS ===', 'info');
            
            try {
                const response = await fetch('http://localhost:8080/api/users');
                log(`Users API response: ${response.status}`, response.ok ? 'success' : 'error');
                
                const responseText = await response.text();
                log(`Raw response: ${responseText}`, 'info');
                
                if (response.ok) {
                    try {
                        const data = JSON.parse(responseText);
                        log(`Response structure: ${JSON.stringify(Object.keys(data))}`, 'info');
                        
                        if (data.success && data.data) {
                            log(`Found ${data.data.length} users in database`, 'success');
                            data.data.forEach((user, index) => {
                                log(`User ${index + 1}: ${user.email} (${user.role}) - ID: ${user.id}`, 'info');
                            });
                        } else {
                            log('Unexpected response structure', 'error');
                        }
                    } catch (e) {
                        log('Failed to parse JSON: ' + e.message, 'error');
                    }
                } else {
                    log('Could not fetch users', 'error');
                }
                
            } catch (error) {
                log('Error checking users: ' + error.message, 'error');
            }
        }

        async function testWithUser19() {
            log('=== TESTING USER 19 ===', 'info');
            
            try {
                const response = await fetch('http://localhost:8080/api/users/19');
                log(`User 19 API: ${response.status}`, response.ok ? 'success' : 'error');
                
                const responseText = await response.text();
                log(`User 19 raw response: ${responseText}`, 'info');
                
                if (response.ok) {
                    const data = JSON.parse(responseText);
                    if (data.success && data.data) {
                        log(`User 19 found: ${data.data.email}`, 'success');
                        log(`Full data: ${JSON.stringify(data.data, null, 2)}`, 'info');
                        
                        // Auto-fill email if found
                        document.getElementById('email').value = data.data.email;
                        log(`Email auto-filled: ${data.data.email}`, 'success');
                    }
                } else {
                    log('User 19 not found', 'error');
                }
                
            } catch (error) {
                log('User 19 API error: ' + error.message, 'error');
            }
        }

        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            log('=== TESTING LOGIN ===', 'info');
            log(`Email: ${email}`, 'info');
            log(`Password: ${'*'.repeat(password.length)}`, 'info');

            const loginData = {
                email: email,
                password: password
            };

            try {
                log('Sending login request...', 'info');
                
                const response = await fetch('http://localhost:8080/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(loginData)
                });

                log(`Response status: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');
                
                const responseText = await response.text();
                log(`Response body: ${responseText}`, 'info');

                if (response.ok) {
                    try {
                        const data = JSON.parse(responseText);
                        log('LOGIN SUCCESS! 🎉', 'success');
                        log('User data: ' + JSON.stringify(data, null, 2), 'success');
                    } catch (e) {
                        log('Login successful but response is not JSON: ' + responseText, 'success');
                    }
                } else {
                    log(`Login failed with status ${response.status}`, 'error');
                    
                    if (response.status === 401) {
                        log('ERROR: Invalid email or password - Check if password is correct', 'error');
                    } else if (response.status === 400) {
                        log('ERROR: Bad request - check email/password format', 'error');
                    } else if (response.status === 500) {
                        log('ERROR: Server error - check backend logs', 'error');
                    }
                }

            } catch (error) {
                log('Network error: ' + error.message, 'error');
            }
        }

        // Auto-load users on page load
        window.onload = function() {
            log('Page loaded. Checking users...', 'info');
            checkUsers();
        };
    </script>
</body>
</html>
