<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Upload Test with Job Link</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .section { margin-bottom: 30px; border: 1px solid #ddd; padding: 20px; border-radius: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, input, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .log { background-color: #f8f9fa; border: 1px solid #dee2e6; padding: 15px; border-radius: 4px; height: 300px; overflow-y: auto; font-family: monospace; white-space: pre-wrap; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
        .info { color: #17a2b8; }
        .user-grid, .job-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .user-card, .job-card { border: 1px solid #ddd; padding: 15px; border-radius: 5px; background-color: #f9f9f9; }
        .selected { background-color: #d4edda; border-color: #28a745; }
    </style>
</head>
<body>
    <div class="container">
        <h1>CV Upload Test with Job Linking</h1>
        
        <div class="section">
            <h2>API Endpoints Status</h2>
            <button onclick="checkBackendStatus()">Check Backend Status</button>
            <div id="status-log" class="log"></div>
        </div>

        <div class="section">
            <h2>Select Candidate User</h2>
            <button onclick="loadUsers()">Load Users</button>
            <div id="user-grid" class="user-grid"></div>
            <p>Selected User: <span id="selected-user">None</span></p>
        </div>

        <div class="section">
            <h2>Select Job</h2>
            <button onclick="loadJobs()">Load Jobs</button>
            <div id="job-grid" class="job-grid"></div>
            <p>Selected Job: <span id="selected-job">None</span></p>
        </div>

        <div class="section">
            <h2>CV Upload Form</h2>
            <form id="cv-upload-form">
                <div class="form-group">
                    <label for="cv-file">Select CV File:</label>
                    <input type="file" id="cv-file" accept=".pdf,.doc,.docx" required>
                </div>
                <div class="form-group">
                    <label for="cover-letter">Cover Letter:</label>
                    <textarea id="cover-letter" rows="4" placeholder="Write a cover letter..."></textarea>
                </div>
                <button type="submit">Submit CV Application</button>
            </form>
        </div>

        <div class="section">
            <h2>Test Log</h2>
            <button onclick="clearLog()">Clear Log</button>
            <div id="test-log" class="log"></div>
        </div>

        <div class="section">
            <h2>Database CV Check</h2>
            <button onclick="checkCVsInDatabase()">Check CVs in Database</button>
            <div id="cv-log" class="log"></div>
        </div>
    </div>

    <script>
        let selectedUserId = null;
        let selectedJobId = null;
        
        const BASE_URL = 'http://localhost:8080/api';
        
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logElement = document.getElementById('test-log');
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            logElement.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            logElement.scrollTop = logElement.scrollHeight;
        }

        function statusLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logElement = document.getElementById('status-log');
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            logElement.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            logElement.scrollTop = logElement.scrollHeight;
        }

        function cvLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logElement = document.getElementById('cv-log');
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            logElement.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            logElement.scrollTop = logElement.scrollHeight;
        }

        function clearLog() {
            document.getElementById('test-log').innerHTML = '';
        }

        async function checkBackendStatus() {
            statusLog('Checking backend status...', 'info');
            
            const endpoints = [
                '/users',
                '/jobs',
                '/applications'
            ];

            for (let endpoint of endpoints) {
                try {
                    const response = await fetch(`${BASE_URL}${endpoint}`);
                    if (response.ok) {
                        statusLog(`✓ ${endpoint} - Status: ${response.status}`, 'success');
                    } else {
                        statusLog(`✗ ${endpoint} - Status: ${response.status}`, 'error');
                    }
                } catch (error) {
                    statusLog(`✗ ${endpoint} - Error: ${error.message}`, 'error');
                }
            }
        }

        async function loadUsers() {
            log('Loading users from database...', 'info');
            try {
                const response = await fetch(`${BASE_URL}/users/candidates`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const result = await response.json();
                log(`Users API Response: ${JSON.stringify(result, null, 2)}`, 'info');
                
                if (result.success && result.data) {
                    displayUsers(result.data);
                    log(`Loaded ${result.data.length} candidate users`, 'success');
                } else {
                    throw new Error(result.message || 'Failed to load users');
                }
            } catch (error) {
                log(`Error loading users: ${error.message}`, 'error');
            }
        }

        async function loadJobs() {
            log('Loading jobs from database...', 'info');
            try {
                const response = await fetch(`${BASE_URL}/jobs`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const result = await response.json();
                log(`Jobs API Response: ${JSON.stringify(result, null, 2)}`, 'info');
                
                if (result.success && result.data) {
                    displayJobs(result.data);
                    log(`Loaded ${result.data.length} jobs`, 'success');
                } else {
                    throw new Error(result.message || 'Failed to load jobs');
                }
            } catch (error) {
                log(`Error loading jobs: ${error.message}`, 'error');
            }
        }

        function displayUsers(users) {
            const userGrid = document.getElementById('user-grid');
            userGrid.innerHTML = '';
            
            users.forEach(user => {
                const userCard = document.createElement('div');
                userCard.className = 'user-card';
                userCard.onclick = () => selectUser(user.id, user.fullName);
                userCard.innerHTML = `
                    <h4>${user.fullName}</h4>
                    <p>Email: ${user.email}</p>
                    <p>Role: ${user.role}</p>
                    <p>ID: ${user.id}</p>
                `;
                userGrid.appendChild(userCard);
            });
        }

        function displayJobs(jobs) {
            const jobGrid = document.getElementById('job-grid');
            jobGrid.innerHTML = '';
            
            jobs.forEach(job => {
                const jobCard = document.createElement('div');
                jobCard.className = 'job-card';
                jobCard.onclick = () => selectJob(job.id, job.title);
                jobCard.innerHTML = `
                    <h4>${job.title}</h4>
                    <p>Company: ${job.employer ? job.employer.companyName : 'N/A'}</p>
                    <p>Location: ${job.location}</p>
                    <p>Salary: ${job.salary}</p>
                    <p>ID: ${job.id}</p>
                `;
                jobGrid.appendChild(jobCard);
            });
        }

        function selectUser(userId, userName) {
            selectedUserId = userId;
            document.getElementById('selected-user').textContent = `${userName} (ID: ${userId})`;
            
            // Remove previous selection styling
            document.querySelectorAll('.user-card').forEach(card => {
                card.classList.remove('selected');
            });
            
            // Add selection styling to clicked card
            event.currentTarget.classList.add('selected');
            
            log(`Selected user: ${userName} (ID: ${userId})`, 'success');
        }

        function selectJob(jobId, jobTitle) {
            selectedJobId = jobId;
            document.getElementById('selected-job').textContent = `${jobTitle} (ID: ${jobId})`;
            
            // Remove previous selection styling
            document.querySelectorAll('.job-card').forEach(card => {
                card.classList.remove('selected');
            });
            
            // Add selection styling to clicked card
            event.currentTarget.classList.add('selected');
            
            log(`Selected job: ${jobTitle} (ID: ${jobId})`, 'success');
        }

        async function checkCVsInDatabase() {
            cvLog('Checking CVs in database...', 'info');
            
            if (!selectedUserId) {
                cvLog('Please select a user first', 'error');
                return;
            }
            
            try {
                // Check if there's an endpoint to get CVs by user
                const response = await fetch(`${BASE_URL}/applications/candidate/${selectedUserId}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const result = await response.json();
                cvLog(`CVs for user ${selectedUserId}: ${JSON.stringify(result, null, 2)}`, 'info');
                
                if (result.success && result.data) {
                    cvLog(`Found ${result.data.length} CV applications for this user`, 'success');
                    result.data.forEach((app, index) => {
                        cvLog(`CV ${index + 1}: Job: ${app.job?.title}, Status: ${app.status}, Applied: ${app.appliedAt}`, 'info');
                    });
                } else {
                    cvLog('No CVs found for this user', 'info');
                }
            } catch (error) {
                cvLog(`Error checking CVs: ${error.message}`, 'error');
            }
        }

        document.getElementById('cv-upload-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!selectedUserId) {
                log('Please select a user first', 'error');
                return;
            }
            
            if (!selectedJobId) {
                log('Please select a job first', 'error');
                return;
            }
            
            const fileInput = document.getElementById('cv-file');
            const coverLetter = document.getElementById('cover-letter').value;
            
            if (!fileInput.files[0]) {
                log('Please select a CV file', 'error');
                return;
            }
            
            const file = fileInput.files[0];
            log(`Starting CV upload for User ID: ${selectedUserId}, Job ID: ${selectedJobId}`, 'info');
            log(`File: ${file.name} (${file.size} bytes, ${file.type})`, 'info');
            
            const formData = new FormData();
            formData.append('jobId', selectedJobId);
            formData.append('candidateId', selectedUserId);
            formData.append('cvFile', file);
            formData.append('coverLetter', coverLetter);
            
            try {
                log('Sending CV upload request...', 'info');
                const response = await fetch(`${BASE_URL}/applications/apply-with-cv`, {
                    method: 'POST',
                    body: formData
                });
                
                log(`Response status: ${response.status}`, 'info');
                
                const result = await response.json();
                log(`Response: ${JSON.stringify(result, null, 2)}`, 'info');
                
                if (response.ok && result.success) {
                    log('✓ CV uploaded successfully!', 'success');
                    log(`Application ID: ${result.data?.id}`, 'success');
                    log('CV has been saved to database with Job ID link', 'success');
                } else {
                    log(`✗ Upload failed: ${result.message}`, 'error');
                }
            } catch (error) {
                log(`✗ Upload error: ${error.message}`, 'error');
            }
        });

        // Auto-check backend status on page load
        window.addEventListener('load', function() {
            checkBackendStatus();
        });
    </script>
</body>
</html>
