<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Test - Login & CV Upload</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f8f9fa; }
        .container { max-width: 1200px; margin: 0 auto; }
        .section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; background: white; border-radius: 8px; }
        .button { padding: 12px 24px; background: #28a745; color: white; border: none; cursor: pointer; margin: 5px; border-radius: 4px; font-size: 14px; }
        .button:hover { background: #218838; }
        .button.primary { background: #007bff; }
        .button.primary:hover { background: #0056b3; }
        .button.danger { background: #dc3545; }
        .button.danger:hover { background: #c82333; }
        input, textarea { margin: 10px 0; padding: 12px; width: 100%; max-width: 400px; display: block; border: 1px solid #ddd; border-radius: 4px; }
        #log { background: #f5f5f5; padding: 15px; height: 400px; overflow-y: auto; font-family: monospace; border: 1px solid #ddd; border-radius: 4px; }
        .error { color: #dc3545; font-weight: bold; }
        .success { color: #28a745; font-weight: bold; }
        .info { color: #007bff; }
        .warning { color: #ffc107; }
        .status-card { display: inline-block; margin: 10px; padding: 15px; border-radius: 8px; min-width: 200px; text-align: center; }
        .status-success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .status-error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .status-pending { background: #fff3cd; border: 1px solid #ffeeba; color: #856404; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Final Test - Login & CV Upload Integration</h1>
        
        <!-- Status Overview -->
        <div class="section">
            <h3>📊 System Status</h3>
            <div id="statusCards">
                <div id="backendStatus" class="status-card status-pending">🔧 Backend: Checking...</div>
                <div id="loginStatus" class="status-card status-pending">🔐 Login: Not tested</div>
                <div id="cvStatus" class="status-card status-pending">📄 CV Upload: Not tested</div>
            </div>
        </div>

        <div class="grid">
            <!-- Login Test -->
            <div class="section">
                <h3>🔐 Login Test</h3>
                <input type="email" id="loginEmail" placeholder="Email" value="testlogin@example.com">
                <input type="password" id="loginPassword" placeholder="Password" value="testpass123">
                <button class="button primary" onclick="testLogin()">Test Login</button>
                <button class="button" onclick="createNewUser()">Create New Test User</button>
                <div id="loginResult"></div>
            </div>

            <!-- CV Upload Test -->
            <div class="section">
                <h3>📄 CV Upload Test</h3>
                <input type="number" id="userId" placeholder="User ID" value="1">
                <input type="number" id="jobId" placeholder="Job ID" value="1">
                <input type="file" id="cvFile" accept=".pdf,.doc,.docx,.txt">
                <textarea id="coverLetter" placeholder="Cover letter...">Test cover letter after login fix</textarea>
                <button class="button" onclick="createTestCV()">Create Test CV</button>
                <button class="button primary" onclick="testCVUpload()">Test CV Upload</button>
                <div id="cvResult"></div>
            </div>
        </div>

        <!-- Complete Test -->
        <div class="section">
            <h3>🚀 Complete Integration Test</h3>
            <button class="button primary" onclick="runCompleteTest()" style="padding: 15px 30px; font-size: 16px;">Run Complete Test</button>
            <button class="button" onclick="checkBackendStatus()">Check Backend</button>
            <button class="button danger" onclick="clearAllLogs()">Clear Logs</button>
        </div>

        <!-- Debug Log -->
        <div class="section">
            <h3>📋 Debug Log</h3>
            <div id="log"></div>
        </div>
    </div>

    <script>
        let testResults = {
            backend: false,
            login: null,
            cvUpload: null,
            loginToken: null,
            loginUserId: null
        };

        function log(msg, type = 'info') {
            const logDiv = document.getElementById('log');
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : type === 'warning' ? 'warning' : 'info';
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `<span class="${className}">[${timestamp}] ${msg}</span>\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function clearAllLogs() {
            document.getElementById('log').innerHTML = '';
            document.getElementById('loginResult').innerHTML = '';
            document.getElementById('cvResult').innerHTML = '';
            log('🧹 Logs cleared', 'info');
        }

        function updateStatus(type, status, message = '') {
            const element = document.getElementById(type + 'Status');
            element.className = 'status-card status-' + (status ? 'success' : 'error');
            
            if (type === 'backend') {
                element.innerHTML = status ? '🔧 Backend: ✅ Running' : '🔧 Backend: ❌ Down';
            } else if (type === 'login') {
                element.innerHTML = status ? '🔐 Login: ✅ Working' : '🔐 Login: ❌ Failed';
            } else if (type === 'cv') {
                element.innerHTML = status ? '📄 CV Upload: ✅ Working' : '📄 CV Upload: ❌ Failed';
            }
        }

        async function checkBackendStatus() {
            log('🔍 Checking backend status...', 'info');
            
            try {
                const response = await fetch('http://localhost:8080/api/jobs');
                if (response.ok) {
                    testResults.backend = true;
                    updateStatus('backend', true);
                    log('✅ Backend is running and responding', 'success');
                    return true;
                } else {
                    testResults.backend = false;
                    updateStatus('backend', false);
                    log('❌ Backend responding with error: ' + response.status, 'error');
                    return false;
                }
            } catch (error) {
                testResults.backend = false;
                updateStatus('backend', false);
                log('❌ Backend connection failed: ' + error.message, 'error');
                log('🔧 Please ensure backend is running: mvnw.cmd spring-boot:run', 'warning');
                return false;
            }
        }

        async function createNewUser() {
            log('👤 Creating new test user...', 'info');
            
            const userData = {
                fullName: "Integration Test User",
                email: "testlogin@example.com",
                password: "testpass123",
                phoneNumber: "0123456789"
            };

            try {
                const response = await fetch('http://localhost:8080/api/auth/register/candidate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });

                if (response.ok) {
                    const result = await response.json();
                    log('✅ Test user created successfully!', 'success');
                    log(`👤 User ID: ${result.userId}`, 'success');
                    document.getElementById('userId').value = result.userId;
                    document.getElementById('loginResult').innerHTML = '<div style="color: green;">✅ User created with ID: ' + result.userId + '</div>';
                } else {
                    const errorText = await response.text();
                    log('❌ Failed to create user: ' + errorText, 'error');
                    if (errorText.includes('already exists')) {
                        log('ℹ️ User already exists, proceeding with existing user', 'info');
                    }
                }
            } catch (error) {
                log('❌ Error creating user: ' + error.message, 'error');
            }
        }

        async function testLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            log('🔐 Testing login...', 'info');
            log(`📧 Email: ${email}`, 'info');

            try {
                const response = await fetch('http://localhost:8080/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    testResults.login = true;
                    testResults.loginToken = data.token;
                    testResults.loginUserId = data.userId;
                    
                    updateStatus('login', true);
                    log('🎉 LOGIN SUCCESS!', 'success');
                    log(`👤 User: ${data.fullName} (${data.role})`, 'success');
                    log(`🔑 Token: ${data.token ? 'Received' : 'Missing'}`, data.token ? 'success' : 'warning');
                    
                    // Auto-fill user ID
                    if (data.userId) {
                        document.getElementById('userId').value = data.userId;
                    }
                    
                    document.getElementById('loginResult').innerHTML = 
                        `<div style="color: green;">✅ Login successful!<br>User: ${data.fullName}<br>ID: ${data.userId}</div>`;
                } else {
                    testResults.login = false;
                    updateStatus('login', false);
                    const responseText = await response.text();
                    log('❌ LOGIN FAILED: ' + responseText, 'error');
                    document.getElementById('loginResult').innerHTML = 
                        `<div style="color: red;">❌ Login failed: ${responseText}</div>`;
                }
            } catch (error) {
                testResults.login = false;
                updateStatus('login', false);
                log('❌ Login network error: ' + error.message, 'error');
                document.getElementById('loginResult').innerHTML = 
                    `<div style="color: red;">❌ Network error: ${error.message}</div>`;
            }
        }

        function createTestCV() {
            const content = "Test CV Content\n\nName: Integration Test User\nPosition: Software Developer\nExperience: 2 years\n\nSkills:\n- Java Spring Boot\n- React\n- MySQL\n\nThis is a test CV file for integration testing.";
            const blob = new Blob([content], { type: 'text/plain' });
            const file = new File([blob], 'integration-test-cv.txt', { type: 'text/plain' });
            
            const dt = new DataTransfer();
            dt.items.add(file);
            document.getElementById('cvFile').files = dt.files;
            
            log('📄 Test CV file created: integration-test-cv.txt (' + file.size + ' bytes)', 'success');
        }

        async function testCVUpload() {
            const userId = document.getElementById('userId').value;
            const jobId = document.getElementById('jobId').value;
            const cvFile = document.getElementById('cvFile').files[0];
            const coverLetter = document.getElementById('coverLetter').value;

            log('📄 Testing CV upload...', 'info');

            if (!cvFile) {
                log('❌ No CV file selected. Creating test file...', 'warning');
                createTestCV();
                await new Promise(resolve => setTimeout(resolve, 500));
                return testCVUpload(); // Retry
            }

            const formData = new FormData();
            formData.append('jobId', jobId);
            formData.append('candidateId', userId);
            formData.append('cvFile', cvFile);
            formData.append('coverLetter', coverLetter);

            try {
                const response = await fetch('http://localhost:8080/api/applications/apply-with-cv', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    testResults.cvUpload = true;
                    updateStatus('cv', true);
                    log('🎉 CV UPLOAD SUCCESS!', 'success');
                    const responseText = await response.text();
                    log('📄 Upload response: ' + responseText, 'success');
                    document.getElementById('cvResult').innerHTML = 
                        `<div style="color: green;">✅ CV upload successful!<br>Response: ${responseText}</div>`;
                } else {
                    testResults.cvUpload = false;
                    updateStatus('cv', false);
                    const responseText = await response.text();
                    log('❌ CV UPLOAD FAILED: ' + responseText, 'error');
                    document.getElementById('cvResult').innerHTML = 
                        `<div style="color: red;">❌ CV upload failed: ${responseText}</div>`;
                }
            } catch (error) {
                testResults.cvUpload = false;
                updateStatus('cv', false);
                log('❌ CV upload network error: ' + error.message, 'error');
                document.getElementById('cvResult').innerHTML = 
                    `<div style="color: red;">❌ Network error: ${error.message}</div>`;
            }
        }

        async function runCompleteTest() {
            log('🚀 ============ RUNNING COMPLETE INTEGRATION TEST ============', 'info');
            
            // Reset results
            testResults.login = null;
            testResults.cvUpload = null;
            
            // Step 1: Check backend
            log('Step 1: Checking backend...', 'info');
            const backendOk = await checkBackendStatus();
            if (!backendOk) {
                log('❌ Cannot proceed without backend. Please start backend first.', 'error');
                return;
            }
            
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            // Step 2: Create user if needed
            log('Step 2: Ensuring test user exists...', 'info');
            await createNewUser();
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            // Step 3: Test login
            log('Step 3: Testing login functionality...', 'info');
            await testLogin();
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            // Step 4: Test CV upload
            log('Step 4: Testing CV upload functionality...', 'info');
            if (!document.getElementById('cvFile').files[0]) {
                createTestCV();
                await new Promise(resolve => setTimeout(resolve, 500));
            }
            await testCVUpload();
            
            // Final results
            log('🏁 ============ INTEGRATION TEST COMPLETE ============', 'info');
            
            if (testResults.login === true && testResults.cvUpload === true) {
                log('🎉🎉🎉 ALL TESTS PASSED! Login and CV Upload both working! 🎉🎉🎉', 'success');
                alert('✅ SUCCESS! Both login and CV upload are working perfectly!');
            } else {
                log('❌ Some tests failed:', 'error');
                log(`🔐 Login: ${testResults.login ? 'PASS' : 'FAIL'}`, testResults.login ? 'success' : 'error');
                log(`📄 CV Upload: ${testResults.cvUpload ? 'PASS' : 'FAIL'}`, testResults.cvUpload ? 'success' : 'error');
            }
        }

        // Auto-initialization
        window.onload = function() {
            log('🚀 Integration test tool loaded', 'info');
            log('🔧 Click "Check Backend" first, then "Run Complete Test"', 'info');
            checkBackendStatus();
        };
    </script>
</body>
</html>
