<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Flow Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        .info { background: #d1ecf1; border-color: #bee5eb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
        .form-group { margin: 10px 0; }
        input { padding: 8px; width: 200px; border: 1px solid #ddd; border-radius: 4px; }
        label { display: inline-block; width: 100px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Login Flow Debugging Tool</h1>
        
        <div class="test-section">
            <h3>1. Test Backend Response</h3>
            <button onclick="testBackendRoles()">Test Role Serialization</button>
            <div id="backend-result"></div>
        </div>

        <div class="test-section">
            <h3>2. Create Test Users</h3>
            <button onclick="createTestEmployer()">Create Test Employer</button>
            <button onclick="createTestCandidate()">Create Test Candidate</button>
            <div id="create-result"></div>
        </div>

        <div class="test-section">
            <h3>3. Test Login Flow</h3>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="testEmail" value="test@employer.com" />
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="testPassword" value="password123" />
            </div>
            <button onclick="testLogin()">Test Login</button>
            <div id="login-result"></div>
        </div>

        <div class="test-section">
            <h3>4. Test Redirect Logic</h3>
            <button onclick="testRedirectLogic()">Test Frontend Redirect Logic</button>
            <div id="redirect-result"></div>
        </div>

        <div class="test-section">
            <h3>5. Test Protected Routes</h3>
            <button onclick="testProtectedRoutes()">Test Role-based Access</button>
            <div id="protected-result"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';
        
        function displayResult(elementId, title, content, type = 'info') {
            const element = document.getElementById(elementId);
            element.innerHTML = `
                <div class="${type}">
                    <h4>${title}</h4>
                    <pre>${content}</pre>
                </div>
            `;
        }

        async function testBackendRoles() {
            try {
                const response = await fetch(`${API_BASE}/debug/test-all-roles`);
                const data = await response.json();
                
                displayResult('backend-result', '✅ Backend Role Test', JSON.stringify(data, null, 2), 'success');
            } catch (error) {
                displayResult('backend-result', '❌ Backend Error', error.message, 'error');
            }
        }

        async function createTestEmployer() {
            try {
                const response = await fetch(`${API_BASE}/debug/create-test-employer`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await response.json();
                
                displayResult('create-result', '✅ Test Employer Created', JSON.stringify(data, null, 2), 'success');
            } catch (error) {
                displayResult('create-result', '❌ Create Employer Error', error.message, 'error');
            }
        }

        async function createTestCandidate() {
            try {
                const response = await fetch(`${API_BASE}/auth/register/candidate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fullName: "Test Candidate",
                        email: "test@candidate.com",
                        password: "password123",
                        phoneNumber: "123456789"
                    })
                });
                const data = await response.json();
                
                displayResult('create-result', '✅ Test Candidate Created', JSON.stringify(data, null, 2), 'success');
            } catch (error) {
                displayResult('create-result', '❌ Create Candidate Error', error.message, 'error');
            }
        }

        async function testLogin() {
            const email = document.getElementById('testEmail').value;
            const password = document.getElementById('testPassword').value;
            
            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                // Simulate frontend storage
                localStorage.setItem('token', data.token || 'test-token');
                localStorage.setItem('role', data.role);
                localStorage.setItem('userId', data.userId);
                
                let analysis = \`Login Response:
\${JSON.stringify(data, null, 2)}

Role Analysis:
- Role value: "\${data.role}"
- Role type: \${typeof data.role}
- Is ADMIN: \${data.role === "ADMIN"}
- Is EMPLOYER: \${data.role === "EMPLOYER"}
- Is CANDIDATE: \${data.role === "CANDIDATE"}

LocalStorage after login:
- token: \${localStorage.getItem('token')}
- role: \${localStorage.getItem('role')}
- userId: \${localStorage.getItem('userId')}\`;

                displayResult('login-result', '✅ Login Test Complete', analysis, 'success');
            } catch (error) {
                displayResult('login-result', '❌ Login Error', error.message, 'error');
            }
        }

        function testRedirectLogic() {
            const role = localStorage.getItem('role');
            
            let redirectUrl;
            let explanation;
            
            if (role === "ADMIN") {
                redirectUrl = "/admin/dashboard";
                explanation = "Admin → Admin Dashboard";
            } else if (role === "EMPLOYER") {
                redirectUrl = "/recruiter/dashboard";
                explanation = "Employer → Recruiter Dashboard";
            } else if (role === "CANDIDATE") {
                redirectUrl = "/";
                explanation = "Candidate → Home Page";
            } else {
                redirectUrl = "/";
                explanation = "Unknown role → Home Page (fallback)";
            }
            
            let analysis = \`Current role in localStorage: "\${role}"
Role type: \${typeof role}

Redirect Logic Test:
- \${explanation}
- Target URL: \${redirectUrl}

String Comparisons:
- role === "ADMIN": \${role === "ADMIN"}
- role === "EMPLOYER": \${role === "EMPLOYER"}
- role === "CANDIDATE": \${role === "CANDIDATE"}

Would redirect to: \${redirectUrl}\`;

            displayResult('redirect-result', '🔀 Redirect Logic Test', analysis, 'info');
        }

        function testProtectedRoutes() {
            const token = localStorage.getItem('token');
            const userRole = localStorage.getItem('role');
            
            let analysis = \`Current Auth State:
- Token: \${token ? 'Present' : 'Missing'}
- Role: "\${userRole}"

Protected Route Tests:
\`;

            const routes = [
                { path: '/admin/dashboard', allowedRoles: ['ADMIN'] },
                { path: '/recruiter/dashboard', allowedRoles: ['EMPLOYER'] },
                { path: '/recruiter/jobs/:id/applicants', allowedRoles: ['EMPLOYER'] }
            ];

            routes.forEach(route => {
                const hasAccess = token && (route.allowedRoles.length === 0 || route.allowedRoles.includes(userRole));
                const result = hasAccess ? '✅ ALLOWED' : '❌ BLOCKED';
                
                analysis += \`
\${route.path}:
  - Allowed roles: [\${route.allowedRoles.join(', ')}]
  - User role: "\${userRole}"
  - Has token: \${!!token}
  - Role check: \${route.allowedRoles.includes(userRole)}
  - Result: \${result}\`;
            });

            displayResult('protected-result', '🛡️ Protected Routes Test', analysis, 'info');
        }

        // Auto-load some data on page load
        window.onload = function() {
            console.log('Login Flow Test Tool loaded');
            console.log('Current localStorage:');
            console.log('- token:', localStorage.getItem('token'));
            console.log('- role:', localStorage.getItem('role'));
            console.log('- userId:', localStorage.getItem('userId'));
        };
    </script>
</body>
</html>
