<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Test User</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; margin: 5px; }
        input { margin: 10px; padding: 10px; width: 300px; display: block; }
        #log { background: #f5f5f5; padding: 10px; height: 300px; overflow-y: auto; font-family: monospace; }
        .error { color: red; }
        .success { color: green; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>🔧 Create Test User for Login</h1>
    
    <div class="section">
        <h3>Create New Test User</h3>
        <input type="text" id="fullName" placeholder="Full Name" value="Test User Login">
        <input type="email" id="email" placeholder="Email" value="testlogin@example.com">
        <input type="password" id="password" placeholder="Password" value="testpass123">
        <input type="text" id="phoneNumber" placeholder="Phone" value="0123456789">
        <button onclick="createUser()">Create Test User</button>
        <button onclick="copyCredentials()">Copy Credentials to Complete Test</button>
    </div>

    <div class="section">
        <h3>Test Immediate Login</h3>
        <button onclick="testLogin()">Test Login with Created User</button>
        <button onclick="checkBackend()">Check Backend Status</button>
    </div>

    <div class="section">
        <h3>Debug Log</h3>
        <div id="log"></div>
        <button onclick="clearLog()">Clear</button>
    </div>

    <script>
        let createdUserData = null;

        function log(msg, type = 'info') {
            const logDiv = document.getElementById('log');
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            logDiv.innerHTML += `<span class="${className}">[${new Date().toLocaleTimeString()}] ${msg}</span>\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        async function checkBackend() {
            log('🔍 Checking backend status...', 'info');
            
            try {
                const response = await fetch('http://localhost:8080/api/users');
                if (response.ok) {
                    log('✅ Backend is running', 'success');
                    return true;
                } else {
                    log('❌ Backend error: ' + response.status, 'error');
                    return false;
                }
            } catch (error) {
                log('❌ Backend not running: ' + error.message, 'error');
                log('🔧 Please start: mvnw.cmd spring-boot:run', 'info');
                return false;
            }
        }

        async function createUser() {
            const userData = {
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                phoneNumber: document.getElementById('phoneNumber').value
            };

            log('🔧 Creating user: ' + userData.email, 'info');

            try {
                const response = await fetch('http://localhost:8080/api/auth/register/candidate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });

                if (response.ok) {
                    const result = await response.json();
                    createdUserData = userData;
                    log('✅ User created successfully!', 'success');
                    log('👤 User ID: ' + result.userId, 'success');
                    log('📧 Email: ' + userData.email, 'success');
                    log('🔑 Password: ' + userData.password, 'success');
                    
                    // Store for copying
                    createdUserData.userId = result.userId;
                } else {
                    const errorText = await response.text();
                    log('❌ Failed to create user: ' + errorText, 'error');
                }
            } catch (error) {
                log('❌ Network error: ' + error.message, 'error');
            }
        }

        async function testLogin() {
            if (!createdUserData) {
                log('❌ No user created yet. Create user first.', 'error');
                return;
            }

            log('🔐 Testing login with created user...', 'info');

            try {
                const response = await fetch('http://localhost:8080/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: createdUserData.email,
                        password: createdUserData.password
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    log('🎉 LOGIN SUCCESS!', 'success');
                    log('👤 User: ' + data.fullName, 'success');
                    log('🔑 Token received: ' + (data.token ? 'YES' : 'NO'), 'success');
                } else {
                    const errorText = await response.text();
                    log('❌ Login failed: ' + errorText, 'error');
                }
            } catch (error) {
                log('❌ Login error: ' + error.message, 'error');
            }
        }

        function copyCredentials() {
            if (!createdUserData) {
                log('❌ No user created yet.', 'error');
                return;
            }

            // Copy to clipboard
            const credentials = `Email: ${createdUserData.email}\nPassword: ${createdUserData.password}\nUser ID: ${createdUserData.userId}`;
            navigator.clipboard.writeText(credentials);
            
            log('📋 Credentials copied to clipboard!', 'success');
            log('📧 Use these in complete-test.html:', 'info');
            log('Email: ' + createdUserData.email, 'info');
            log('Password: ' + createdUserData.password, 'info');
            log('User ID: ' + createdUserData.userId, 'info');
        }

        // Auto-load
        window.onload = function() {
            log('🚀 Test user creation tool loaded.', 'info');
            checkBackend();
        };
    </script>
</body>
</html>
