<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Debug Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; margin: 5px; }
        input { margin: 10px; padding: 10px; width: 300px; display: block; }
        #log { background: #f5f5f5; padding: 10px; height: 500px; overflow-y: auto; font-family: monospace; }
        .error { color: red; }
        .success { color: green; }
        .info { color: blue; }
        .warning { color: orange; }
        .test-credentials { background: #e9ecef; padding: 10px; margin: 10px 0; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Password Debug Test</h1>
    
    <div class="section">
        <h3>Thông tin User ID 19</h3>
        <div class="test-credentials">
            <strong>Email:</strong> phucnn1@gmail.com<br>
            <strong>User ID:</strong> 19<br>
            <strong>Role:</strong> CANDIDATE
        </div>
        
        <input type="email" id="email" placeholder="Email" value="phucnn1@gmail.com">
        <input type="password" id="password" placeholder="Password" value="">
        
        <div style="margin: 15px 0;">
            <strong>Thử các password phổ biến:</strong><br>
            <button onclick="tryPassword('password')">Try 'password'</button>
            <button onclick="tryPassword('123456')">Try '123456'</button>
            <button onclick="tryPassword('password123')">Try 'password123'</button>
            <button onclick="tryPassword('phucnn1')">Try 'phucnn1'</button>
            <button onclick="tryPassword('admin')">Try 'admin'</button>
        </div>
        
        <button onclick="testLogin()">Test Manual Password</button>
        <button onclick="checkPasswordHash()">Check Password Hash</button>
        <button onclick="createNewTestUser()">Create New Test User</button>
    </div>

    <div class="section">
        <h3>Debug Log</h3>
        <div id="log"></div>
        <button onclick="clearLog()">Clear</button>
    </div>

    <script>
        function log(msg, type = 'info') {
            const logDiv = document.getElementById('log');
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : type === 'warning' ? 'warning' : 'info';
            logDiv.innerHTML += `<span class="${className}">[${new Date().toLocaleTimeString()}] ${msg}</span>\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        function tryPassword(password) {
            document.getElementById('password').value = password;
            log(`Thử password: "${password}"`, 'info');
            testLogin();
        }

        async function checkPasswordHash() {
            log('=== CHECKING PASSWORD HASH ===', 'info');
            
            try {
                const response = await fetch('http://localhost:8080/api/users/19');
                
                if (response.ok) {
                    const data = await response.json();
                    if (data.success && data.data) {
                        const user = data.data;
                        log(`Current password hash: ${user.passwordHash}`, 'info');
                        log(`Hash starts with: ${user.passwordHash.substring(0, 10)}...`, 'info');
                        
                        // Check if it's BCrypt format
                        if (user.passwordHash.startsWith('$2a$') || user.passwordHash.startsWith('$2b$')) {
                            log('Password hash format: BCrypt ✓', 'success');
                        } else {
                            log('Password hash format: Unknown ⚠️', 'warning');
                        }
                    }
                } else {
                    log('Could not fetch user data', 'error');
                }
                
            } catch (error) {
                log('Error checking password hash: ' + error.message, 'error');
            }
        }

        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!password) {
                log('ERROR: Password is empty!', 'error');
                return;
            }

            log(`=== TESTING LOGIN ===`, 'info');
            log(`Email: ${email}`, 'info');
            log(`Password: "${password}" (${password.length} characters)`, 'info');

            const loginData = {
                email: email,
                password: password
            };

            try {
                log('Sending login request...', 'info');
                
                const response = await fetch('http://localhost:8080/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(loginData)
                });

                log(`Response status: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');
                
                const responseText = await response.text();
                log(`Response body: ${responseText}`, 'info');

                if (response.ok) {
                    try {
                        const data = JSON.parse(responseText);
                        log('🎉 LOGIN SUCCESS! 🎉', 'success');
                        log('User data: ' + JSON.stringify(data, null, 2), 'success');
                        log(`Token: ${data.token ? 'Có' : 'Không có'}`, data.token ? 'success' : 'warning');
                        return data;
                    } catch (e) {
                        log('Login successful but response is not JSON: ' + responseText, 'success');
                    }
                } else {
                    log(`❌ Login failed with status ${response.status}`, 'error');
                    
                    if (response.status === 401) {
                        log('REASON: Invalid email or password', 'error');
                        log('Solutions: 1) Check password is correct, 2) Try different passwords, 3) Create new user', 'warning');
                    } else if (response.status === 400) {
                        log('REASON: Bad request - check email/password format', 'error');
                    } else if (response.status === 500) {
                        log('REASON: Server error - check backend logs', 'error');
                    }
                }

            } catch (error) {
                log('Network error: ' + error.message, 'error');
            }
        }

        async function createNewTestUser() {
            log('=== CREATING NEW TEST USER ===', 'info');
            
            const registerData = {
                fullName: "Debug Test User",
                email: "debug.test@example.com",
                password: "testpassword123",
                phoneNumber: "1234567890"
            };

            try {
                const response = await fetch('http://localhost:8080/api/auth/register/candidate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(registerData)
                });

                log(`Register response: ${response.status}`, response.ok ? 'success' : 'error');
                
                const responseText = await response.text();
                log(`Register result: ${responseText}`, 'info');

                if (response.ok) {
                    log('✅ New test user created successfully!', 'success');
                    log('Now try login with:', 'info');
                    log('Email: debug.test@example.com', 'info');
                    log('Password: testpassword123', 'info');
                    
                    // Auto-fill the new credentials
                    document.getElementById('email').value = 'debug.test@example.com';
                    document.getElementById('password').value = 'testpassword123';
                    
                    log('Credentials auto-filled. Click "Test Manual Password" to login.', 'success');
                } else {
                    log('❌ Failed to create test user', 'error');
                }

            } catch (error) {
                log('Register error: ' + error.message, 'error');
            }
        }

        // Auto-load on page load
        window.onload = function() {
            log('Password debug page loaded.', 'info');
            log('1. Try common passwords with buttons above', 'info');
            log('2. Or click "Create New Test User" for guaranteed working credentials', 'info');
            checkPasswordHash();
        };
    </script>
</body>
</html>
